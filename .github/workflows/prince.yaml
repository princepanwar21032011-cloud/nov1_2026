name: myworkflow1
on:
  push:
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cd
          ls -al
          sshpass -V
      - name: mystep2-clone the repo
        uses: actions/checkout@v4

      - name: mystep3-check the source code
        run: ls -al
         
      - name: mystep4-build docker image
        run: docker build -t princepanwar21032011/myimage_nov_1:t${{ github.run_number }} -f Dockerfile .

      - name: mystep5-check the docker image
        run: sudo docker image ls

      - name: mystep6-login to docker hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: myimage7-push image to docker
        run: docker push princepanwar21032011/myimage_nov_1:t${{ github.run_number }}

      - name: login to remote server
        run: |
          sshpass -p 'Anil@332211' ssh \
          -o StrictHostKeyChecking=accept-new \
          root@164.68.105.85 \
          'ls -al'
